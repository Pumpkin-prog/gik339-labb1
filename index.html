<html lang="sv">
  <meta charset="utf-8" />
  <head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min sida</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Min sida</h1>
  </body>
</html>
<!--
Script-taggen kan placeras längst ned i body för att säkerställa
att HTML-elementen har laddats innan JavaScript körs

Man kan annars använda defer i head. Då laddas
JavaScript-filen direkt men körs först när HTML-dokumentet är färdigläst
-->
